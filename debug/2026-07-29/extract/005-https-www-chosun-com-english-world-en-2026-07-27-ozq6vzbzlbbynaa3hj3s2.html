        </iframe></noscript><div id="fusion-app"><div style="display:none" id="article" data-fusion-collection="layouts" data-fusion-type="article" data-fusion-message="Could not render component [layouts:article]"></div></div><script id="fusion-metadata" type="application/javascript">window.Fusion=window.Fusion||{};Fusion.arcSite="chosun";Fusion.contextPath="/pf";Fusion.mxId="00000000";Fusion.deployment="2276";Fusion.globalContent={"_id":"OZQ6VZBZLBBYNAA3HJ3S2FEMDI","canonical_url":"/english/world-en/2026/07/27/OZQ6VZBZLBBYNAA3HJ3S2FEMDI/","canonical_website":"chosun","content_elements":[{"_id":"X2EDHYSKJBLWBKBNBQ3CELTEFQ","caption":"Supporters of the 'Cockroach Janta Party' gathered in New Delhi, India, cheer on the 25th as news spreads of the resignation of Minister of Education Dharmendra Pradhan. The youth-led Cockroach National Party leads protests demanding the resignation of Minister Pradhan, triggered by the medical school entrance exam question leak scandal. /EPA-Yonhap","credits":{"affiliation":[{"name":"YNA"}],"by":[{"name":"RAJAT GUPTA"}]},"height":2892,"resizedUrls":{"article_leadart":"https://www.chosun.com/resizer/v2/X2EDHYSKJBLWBKBNBQ3CELTEFQ.jpg?auth=f57314526e048d3e92f3ee2b03f6120f9d597cc80b0e7d8c30f7560ee238cac2&width=1280","article_leadart_lg":"https://www.chosun.com/resizer/v2/X2EDHYSKJBLWBKBNBQ3CELTEFQ.jpg?auth=f57314526e048d3e92f3ee2b03f6120f9d597cc80b0e7d8c30f7560ee238cac2&width=2560","article_lg":"https://www.chosun.com/resizer/v2/X2EDHYSKJBLWBKBNBQ3CELTEFQ.jpg?auth=f57314526e048d3e92f3ee2b03f6120f9d597cc80b0e7d8c30f7560ee238cac2&width=616","article_md":"https://www.chosun.com/resizer/v2/X2EDHYSKJBLWBKBNBQ3CELTEFQ.jpg?auth=f57314526e048d3e92f3ee2b03f6120f9d597cc80b0e7d8c30f7560ee238cac2&width=464","article_sm":"https://www.chosun.com/resizer/v2/X2EDHYSKJBLWBKBNBQ3CELTEFQ.jpg?auth=f57314526e048d3e92f3ee2b03f6120f9d597cc80b0e7d8c30f7560ee238cac2&width=216","social_share":"https://www.chosun.com/resizer/v2/X2EDHYSKJBLWBKBNBQ3CELTEFQ.jpg?auth=f57314526e048d3e92f3ee2b03f6120f9d597cc80b0e7d8c30f7560ee238cac2&width=1200&height=630&smart=true"},"type":"image","url":"https://cloudfront-ap-northeast-1.images.arcpublishing.com/chosun/X2EDHYSKJBLWBKBNBQ3CELTEFQ.jpg","width":4116},{"_id":"MEYWL4N7SNGF7OJR7B4OKLMJJE","content":"India’s Education Minister Dharmendra Pradhan, a key figure in Narendra Modi’s government, resigned on the 25th amid a nationwide scandal over leaked medical school entrance exam questions. This came a month after the youth political group “Cockroach Janta Party (CJP),” formed in response to the leak, began demanding his ouster.","type":"text"},{"_id":"2H7NLUQNDFAM7DN47T6SOAQCVI","content":"This marks the first time a minister in Modi’s administration has stepped down under public pressure. Pradhan, widely seen as a potential successor to Modi, was a powerbroker in the government, raising speculation that this incident could ignite broader resistance. Analysts warn that if the government fails to address youth frustrations—exacerbated by severe unemployment—the protests could escalate into large-scale anti-government demonstrations, mirroring global trends since last year.","type":"text"},{"_id":"Q6QH4LMBQ5FXLNDXPERD4Y5ZJM","content":"<b>◇“Modi Makes Unprecedented Concession to Public Pressure”</b>","type":"text"},{"_id":"5VEPRQZZF5HVPNZLPWRV2DPM3U","content":"In a social media statement, Pradhan announced his resignation, stating, “I am stepping down to prevent anti-national forces from exploiting the nationwide situation, including at Jantar Mantar, and to ensure young people are not drawn into chaos.” Jantar Mantar, a central Delhi site, became symbolic of the government’s accountability in the exam leak after the CJP held its first protest there on June 6.","type":"text"},{"_id":"NAP3VMVVUVDDROPJW7KPMJG5PA","caption":"","credits":{"affiliation":[]},"height":551,"resizedUrls":{"article_leadart":"https://www.chosun.com/resizer/v2/NAP3VMVVUVDDROPJW7KPMJG5PA.png?auth=e68920ee24a3ba80cfdd5b4a025ea0b5b32cffd6fc59d9e7c17c51b02ef84567&width=480&height=551&smart=true","article_leadart_lg":"https://www.chosun.com/resizer/v2/NAP3VMVVUVDDROPJW7KPMJG5PA.png?auth=e68920ee24a3ba80cfdd5b4a025ea0b5b32cffd6fc59d9e7c17c51b02ef84567&width=480&height=551&smart=true","article_lg":"https://www.chosun.com/resizer/v2/NAP3VMVVUVDDROPJW7KPMJG5PA.png?auth=e68920ee24a3ba80cfdd5b4a025ea0b5b32cffd6fc59d9e7c17c51b02ef84567&width=480&height=551&smart=true","article_md":"https://www.chosun.com/resizer/v2/NAP3VMVVUVDDROPJW7KPMJG5PA.png?auth=e68920ee24a3ba80cfdd5b4a025ea0b5b32cffd6fc59d9e7c17c51b02ef84567&width=464","article_sm":"https://www.chosun.com/resizer/v2/NAP3VMVVUVDDROPJW7KPMJG5PA.png?auth=e68920ee24a3ba80cfdd5b4a025ea0b5b32cffd6fc59d9e7c17c51b02ef84567&width=216","social_share":"https://www.chosun.com/resizer/v2/NAP3VMVVUVDDROPJW7KPMJG5PA.png?auth=e68920ee24a3ba80cfdd5b4a025ea0b5b32cffd6fc59d9e7c17c51b02ef84567&width=480&height=252&smart=true"},"type":"image","url":"https://cloudfront-ap-northeast-1.images.arcpublishing.com/chosun/NAP3VMVVUVDDROPJW7KPMJG5PA.png","width":480},{"_id":"EGMXY624VJHQRDZHJSXAYJG23Y","content":"The scandal erupted on May 3 when widespread cheating was detected during the National Eligibility-cum-Entrance Test (NEET), a critical medical school exam. Authorities confirmed that question papers were leaked in Rajasthan days before the test. Over 2.2 million students were forced to retake the exam, but at least 20 youths died by suicide amid the pressure.","type":"text"},{"_id":"B6K2IDLY5BCBVL5COWV335KQFI","content":"Abhijeet Dipke, 30, a Dalit and former party spokesperson who studied in the U.S., channeled this anger. After returning from abroad post-leak, he mobilized youth to form the CJP. The party’s name—a jab at Chief Justice Surya Kant’s derogatory comparison of unemployed youth to “cockroaches”—embodied defiance against the establishment.","type":"text"},{"_id":"R7NTAGZISNFPVCABUICZABEWEA","content":"Pradhan initially dismissed the CJP as “terrorists” during media interviews. Police violence against protesters intensified backlash, prompting opposition leaders to hold rallies outside the prime minister’s residence. Modi eventually promised investigations and punishments, signaling a retreat.","type":"text"},{"_id":"5NEOE45WXJCENJ746RB6UNT4HY","content":"Indian media called Modi’s concession unusual. The Times of India noted, “Modi has never yielded to opposition pressure over scandals, controversial laws, or ministerial corruption since taking office. Pradhan’s resignation deals a significant political blow to Modi and the BJP.”","type":"text"},{"_id":"O3RIHXCMI5DPJDEMT4J52LXRIU","content":"A longtime BJP loyalist, Pradhan rose through the party’s youth wing, served as a member of parliament, and held key portfolios—petroleum, steel, and education—since Modi’s 2014 premiership. He was widely viewed as a future leadership contender.","type":"text"},{"_id":"J6ZUN5TSGVDCJHRL2V63XLPSUI","content":"The CJP, having secured Pradhan’s resignation, ended its month-long protests. It stated, “The government accepted all demands: education system reforms, compensation for bereaved families, and no legal action against protesters. We will withdraw peacefully.” Protesters cheered, waving flags upon hearing the news.","type":"text"},{"_id":"WU7XBKBLURC4DOS5FIN6BBEAAQ","content":"<b>◇“Anti-Establishment Movements May Persist”</b>","type":"text"},{"_id":"626BW2LHOVA5NJFW4UQL26AINA","content":"While Pradhan’s exit halted protests, analysts argue youth anger remains unresolved. A report by Azim Premji University revealed that 40% of 15–25-year-old graduates and 20% of 25–29-year-old graduates are unemployed. With 367 million people aged 15–29, India’s demographic advantage could turn into a crisis as the working-age population declines post-2030.","type":"text"},{"_id":"CV4OV3WAB5HUDCWYXIQT73T3PE","content":"Last year, Gen Z-led protests swept Nepal, Asia, Latin America, and Europe, toppling governments over corruption, incompetence, and inequality. In India, fears of a similar trajectory persist due to economic anxieties and Modi’s authoritarian governance. Political analyst Amitabh Tiwari told Reuters, “The exam leak was a trigger, but the protests reflect deeper youth disillusionment. If the CJP becomes a formal party, it could threaten Modi in the 2029 elections.”","type":"text"}],"created_date":"2026-07-26T15:45:55.786Z","credits":{"by":[{"_id":"lee-minjun","additional_properties":{"original":{"affiliations":"","bio":"국제 뉴스를 전합니다. 2022년 12월 입사해 사회부 기동취재·법조팀을 거쳤습니다.","bio_page":"","byline":"Lee Min-jun","email":"mean@chosun.com","image":"https://author-service-images-prod-us-east-1.publishing.aws.arc.pub/chosun/cab1e87c-f185-4bec-80c2-3b7f6cac2a88.png","longBio":"국제 뉴스를 전합니다. 2022년 12월 입사해 사회부 기동취재·법조팀을 거쳤습니다."}},"image":{"url":"https://author-service-images-prod-us-east-1.publishing.aws.arc.pub/chosun/cab1e87c-f185-4bec-80c2-3b7f6cac2a88.png"},"name":"민준 이","org":"서울","resizedUrls":{"author":"https://www.chosun.com/resizer/v2/https%3A%2F%2Fauthor-service-images-prod-us-east-1.publishing.aws.arc.pub%2Fchosun%2Fcab1e87c-f185-4bec-80c2-3b7f6cac2a88.png?auth=ddda87e654f363a111dabd85648ea4683bcf2ad65a369f466e86b8e46f79141f&width=108&height=108&smart=true"},"type":"author","url":""},{"_id":"kim-hyemin","additional_properties":{"original":{"affiliations":"","bio":"2024년 입사, 사회부 기동팀을 거쳐 국제부에서 취재하고 있습니다.","bio_page":"","byline":"Kim Hye-min","email":"hmmm@chosun.com","image":"https://author-service-images-prod-us-east-1.publishing.aws.arc.pub/chosun/ad210811-4d45-4d24-90fe-4aa803137f74.jpg","longBio":""}},"image":{"url":"https://author-service-images-prod-us-east-1.publishing.aws.arc.pub/chosun/ad210811-4d45-4d24-90fe-4aa803137f74.jpg"},"name":"혜민 김","resizedUrls":{"author":"https://www.chosun.com/resizer/v2/https%3A%2F%2Fauthor-service-images-prod-us-east-1.publishing.aws.arc.pub%2Fchosun%2Fad210811-4d45-4d24-90fe-4aa803137f74.jpg?auth=a27993d10fab782ebab5a5045bcb5b651e8cb50564478b9d0d1 120f9d597cc80b0e7d8c30f7560ee238cac2&width=2560","article_leadart_sm":"https://www.chosun.com/resizer/v2/X2EDHYSKJBLWBKBNBQ3CELTEFQ.jpg?auth=f57314526e048d3e92f3ee2b03f6120f9d597cc80b0e7d8c30f7560ee238cac2&width=768","social_share":"https://www.chosun.com/resizer/v2/X2EDHYSKJBLWBKBNBQ3CELTEFQ.jpg?auth=f57314526e048d3e92f3ee2b03f6120f9d597cc80b0e7d8c30f7560ee238cac2&width=1200&height=630&smart=true","cmc":"https://www.chosun.com/resizer/v2/X2EDHYSKJBLWBKBNBQ3CELTEFQ.jpg?auth=f57314526e048d3e92f3ee2b03f6120f9d597cc80b0e7d8c30f7560ee238cac2&width=4116&height=2892&smart=true","fusion_feed":"https://www.chosun.com/resizer/v2/X2EDHYSKJBLWBKBNBQ3CELTEFQ.jpg?auth=f57314526e048d3e92f3ee2b03f6120f9d597cc80b0e7d8c30f7560ee238cac2&width=4116&height=2892&smart=true","original":"https://www.chosun.com/resizer/v2/X2EDHYSKJBLWBKBNBQ3CELTEFQ.jpg?auth=f57314526e048d3e92f3ee2b03f6120f9d597cc80b0e7d8c30f7560ee238cac2&width=4116&height=2892&smart=true","author":"https://www.chosun.com/resizer/v2/X2EDHYSKJBLWBKBNBQ3CELTEFQ.jpg?auth=f57314526e048d3e92f3ee2b03f6120f9d597cc80b0e7d8c30f7560ee238cac2&width=108&height=108&smart=true"}},{"_id":"MEYWL4N7SNGF7OJR7B4OKLMJJE","additional_properties":{"comments":[],"inline_comments":[]},"content":"인도에서 벌어진 전국 의과대학 입학 자격시험 문제 유출 사태로 나렌드라 모디 정권의 핵심 인사인 다르멘드라 프라단 교육부 장관이 25일 사임했다. 유출 사태를 계기로 결성된 청년 정치 단체 ‘바퀴벌레 국민당(CJP)’이 지난달 본격적인 퇴진 요구에 나선 지 한 달여 만이다. ","type":"text"},{"_id":"2H7NLUQNDFAM7DN47T6SOAQCVI","additional_properties":{"comments":[],"inline_comments":[]},"content":"이는 모디 정권의 장관급이 여론에 밀려 퇴진한 첫 사례다. 더구나 프라단은 모디 정권의 차기 주자로 꼽혔던 실세라는 점에서 이번 일이 향후 저항 운동의 기폭제가 될 수 있다는 전망도 나온다. 극심한 취업난 등으로 누적된 청년들의 불만을 정부가 해결하지 못할 경우 지난해 이후 세계 각지에서 계속된 대규모 반정부 시위로 번질 수도 있다는 것이다. ","type":"text"},{"_id":"Q6QH4LMBQ5FXLNDXPERD4Y5ZJM","additional_properties":{"comments":[],"inline_comments":[]},"content":"<b>◇“모디, 여론에 이례적 양보”</b>","type":"text"},{"_id":"5VEPRQZZF5HVPNZLPWRV2DPM3U","additional_properties":{"comments":[],"inline_comments":[]},"content":"프라단 장관은 이날 소셜미디어에 올린 입장문에서 “잔타르 만타르를 비롯한 전국적 상황을 반국가 세력이 악용하지 못하도록 장관직에서 사임한다”며 “젊은이들이 혼란의 소용돌이에 빠져서는 안 된다”고 밝혔다. 인도 수도 뉴델리 중심부의 잔타르 만타르는 바퀴벌레 국민당이 지난달 6일 프라단의 퇴진을 요구하는 집회를 처음 개최한 곳이다. 이후 시험 유출 사태에 대한 정부의 책임을 상징하는 이름이 돼 왔다. ","type":"text"},{"_id":"NAP3VMVVUVDDROPJW7KPMJG5PA","additional_properties":{"fullSizeResizeUrl":"/resizer/v2/NAP3VMVVUVDDROPJW7KPMJG5PA.png?auth=e68920ee24a3ba80cfdd5b4a025ea0b5b32cffd6fc59d9e7c17c51b02ef84567","galleries":[],"ingestionMethod":"manual","keywords":["인도 ‘바퀴벌레 국민당’의 시위 과정"],"mime_type":"image/png","originalName":"인도 Z세대 사태 주요 일지 copy.png","originalUrl":"https://cloudfront-ap-northeast-1.images.arcpublishing.com/chosun/NAP3VMVVUVDDROPJW7KPMJG5PA.png","owner":"burbuck@chosun.com","proxyUrl":"/resizer/v2/NAP3VMVVUVDDROPJW7KPMJG5PA.png?auth=e68920ee24a3ba80cfdd5b4a025ea0b5b32cffd6fc59d9e7c17c51b02ef84567","published":true,"resizeUrl":"/resizer/v2/NAP3VMVVUVDDROPJW7KPMJG5PA.png?auth=e68920ee24a3ba80cfdd5b4a025ea0b5b32cffd6fc59d9e7c17c51b02ef84567","restricted":false,"thumbnailResizeUrl":"/resizer/v2/NAP3VMVVUVDDROPJW7KPMJG5PA.png?auth=e68920ee24a3ba80cfdd5b4a025ea0b5b32cffd6fc59d9e7c17c51b02ef84567&width=300","version":0,"template_id":128},"address":{},"auth":{"1":"e68920ee24a3ba80cfdd5b4a025ea0b5b32cffd6fc59d9e7c17c51b02ef84567"},"caption":"","created_date":"2026-07-26T11:02:20Z","credits":{"affiliation":[]},"distributor":{"mode":"reference","reference_id":"3b1a5afb-1da2-416b-8bd7-b3c3e8b1fff6"},"height":551,"image_type":"graphic","last_updated_date":"2026-07-26T11:02:20Z","licensable":false,"owner":{"id":"chosun","sponsored":false},"source":{"name":"Chosun","source_type":"staff","additional_properties":{"editor":"photo center"},"edit_url":"","system":"photo center"},"subtitle":"인도 ‘바퀴벌레 국민당’의 시위 과정","taxonomy":{"associated_tasks":[]},"type":"image","url":"https://cloudfront-ap-northeast-1.images.arcpublishing.com/chosun/NAP3VMVVUVDDROPJW7KPMJG5PA.png","version":"0.10.9","width":480,"syndication":{"external_distribution":true,"search":true},"resizedUrls" d6fc59d9e7c17c51b02ef84567&width=480&height=551&smart=true","social_share":"https://www.chosun.com/resizer/v2/NAP3VMVVUVDDROPJW7KPMJG5PA.png?auth=e68920ee24a3ba80cfdd5b4a025ea0b5b32cffd6fc59d9e7c17c51b02ef84567&width=480&height=252&smart=true","cmc":"https://www.chosun.com/resizer/v2/NAP3VMVVUVDDROPJW7KPMJG5PA.png?auth=e68920ee24a3ba80cfdd5b4a025ea0b5b32cffd6fc59d9e7c17c51b02ef84567&width=480&height=551&smart=true","fusion_feed":"https://www.chosun.com/resizer/v2/NAP3VMVVUVDDROPJW7KPMJG5PA.png?auth=e68920ee24a3ba80cfdd5b4a025ea0b5b32cffd6fc59d9e7c17c51b02ef84567&width=480&height=551&smart=true","original":"https://www.chosun.com/resizer/v2/NAP3VMVVUVDDROPJW7KPMJG5PA.png?auth=e68920ee24a3ba80cfdd5b4a025ea0b5b32cffd6fc59d9e7c17c51b02ef84567&width=480&height=551&smart=true","author":"https://www.chosun.com/resizer/v2/NAP3VMVVUVDDROPJW7KPMJG5PA.png?auth=e68920ee24a3ba80cfdd5b4a025ea0b5b32cffd6fc59d9e7c17c51b02ef84567&width=108&height=108&smart=true"}},{"_id":"EGMXY624VJHQRDZHJSXAYJG23Y","additional_properties":{"comments":[],"inline_comments":[]},"content":"앞서 지난 5월 3일 인도 전역에서 치러진 의대 입학 시험에서 대규모 부정행위가 적발돼 파장이 일었다. 인도 당국에 따르면 시험 며칠 전 문제지가 서부 라자스탄주에서 유출된 것으로 파악됐다. 정부가 시험을 무효 처리해 응시자 220만여 명은 시험을 다시 보게 됐다. 그러나 재시험의 압박을 견디지 못한 수험생 20여 명이 잇따라 스스로 목숨을 끊으면서 2030세대를 중심으로 대중의 분노가 폭발했다.","type":"text"},{"_id":"B6K2IDLY5BCBVL5COWV335KQFI","additional_properties":{"comments":[],"inline_comments":[]},"content":"카스트 제도의 최하 계급 ‘달리트’ 출신인 아비지트 딥케(30)가 그 분노를 결집시켰다. 정당 공보 담당자로 일하다 미국 유학을 떠났던 그는 유출 사태 이후 귀국, 청년들을 모아 바퀴벌레 국민당을 결성했다. 앞서 수리야 칸트 대법원장이 일자리를 구하지 못한 청년들을 바퀴벌레에 빗대자 바퀴벌레라는 이름을 내세워 기득권을 향한 분노를 드러냈다. ","type":"text"},{"_id":"R7NTAGZISNFPVCABUICZABEWEA","additional_properties":{"comments":[],"inline_comments":[]},"content":"프라단도 시위 초기 언론 인터뷰에서 바퀴벌레 국민당을 “테러리스트”라고 비난했다. 경찰이 곤봉을 휘두르며 이들의 시위를 무력 진압하자 야당 대표가 의원들을 이끌고 총리 관저 앞에서 규탄 집회를 여는 등 정부 비판 여론이 더욱 거세졌다. 모디는 결국 진상 규명과 관련자 처벌을 약속하며 한발 물러섰다. ","type":"text"},{"_id":"5NEOE45WXJCENJ746RB6UNT4HY","additional_properties":{"comments":[],"inline_comments":[]},"content":"인도 현지 언론은 모디의 후퇴는 이례적이라고 전했다. 더타임스오브인디아는 “모디는 취임 이후 각종 의혹, 논란의 여지가 있는 법안, 장관 비리 혐의 등을 둘러싼 야당의 공세와 압박에 굴복하는 모습을 전혀 보이지 않았다”며 “내각 핵심 멤버였던 프라단의 사임은 모디와 당에 상당한 정치적 타격을 줬다”고 분석했다.","type":"text"},{"_id":"O3RIHXCMI5DPJDEMT4J52LXRIU","additional_properties":{"comments":[],"inline_comments":[]},"content":"프라단은 모디가 소속된 집권 인도인민당(BJP)에서 청년단 전국회장 등을 거치며 잔뼈가 굵은 인물이다. BJP 소속으로 하원 의원에 당선됐고, 2014년 모디가 총리에 취임한 뒤 단행한 첫 내각 인사에서 석유·천연가스부 장관에 임명됐다. 이후 철강부 장관을 거쳐 교육부 장관까지 맡으며 ‘차기 권력’ 후보로 꼽혀 왔다. ","type":"text"},{"_id":"J6ZUN5TSGVDCJHRL2V63XLPSUI","additional_properties":{"comments":[],"inline_comments":[]},"content":"프라단의 사임을 얻어낸 바퀴벌레 국민당은 한 달 넘게 이어 온 시위를 멈추기로 했다. 이들은 “프라단의 사임 이후 정부가 교육 시스템 전반에 걸친 개혁, 숨진 수험생 유가족에 대한 보상, 시위 참여자에 대한 법적 조치 금지 등 요구 사항을 모두 받아들였다”며 “평화롭게 시위 현장에서 물러나자”고 했다. 프라단의 사임 소식이 전해지자 시위 현장의 청년들은 국기를 흔들며 환호했다. ","type":"text"},{"_id":"WU7XBKBLURC4DOS5FIN6BBEAAQ","additional_properties":{"comments":[],"inline_comments":[]},"content":"<b>◇“반체제 움직임 계속될 수도”</b>","type":"text"},{"_id":"626BW2LHOVA5NJFW4UQL26AINA","additional_properties":{"comments":[],"inline_comments":[]},"content":"프라단의 퇴진으로 시위는 일단 중단됐지만 청년들의 분노는 완전히 해소되지 않았다는 분석도 나온다. 극심한 취업난이 주요 이유로 꼽힌다. 인도 아짐 프렘지 대학이 올해 발표한 보고서에 따르면, 대학을 졸업한 15~25세 청년의 40%가량이 실업 상태다. 25~29세 대졸자 20%도 마찬가지다. 연구팀은 “인도는 15~29세 청년이 3억6700만명인 ‘젊은 나라’지만 2030년 이후 이런 노동 가능 인구는 줄어들 것”이라고 경고했다. 인구 구조상 향후 취업난·경제난이 가중될 수 있다는 것이다. ","type":"text"},{"_id":"CV4OV3WAB5HUDCWYXIQT73T3PE","additional_properties":{"comments":[],"inline_comments":[]},"content":"지난해 네팔을 시작으로 아시아, 중남미, 유럽 등지에서 ‘Z세대’로 불리는 청년들이 대규모 반정부 시위를 이끌었다. 정부의 부패와 무능, 경제적 불평등 등으로 촉발된 시위 끝에 일부 국가에서는 정권이 교체되기도 했다. 인도에서도 미래에 대한 불안감, 모디 정권의 권위적 통치 방식에 대한 불만 등으로 반체제 운동이 계속될 수 있다는 전망도 나온다. 정치 분석가 아미타브 티와리는 로이터에 “시험 문제 유출은 기폭제였을 뿐, 이번 시위엔 젊은 세대의 불안감과 분노가 그대로 반영됐다”며 “CJP가 정당으로 전환할 경우 2029년 총선에서 모디에게 큰 위협이 될 것”이라고 말했다. ","type":"text"}],"description":{"basic":""},"headlines":{"basic":"‘바퀴벌레’가 거물 잡았다… 인도 Z세대 분노, 교육장관 퇴진 이끌어","mobile":""},"language":"","promo_items":{"basic" "Industry"}},"type":"story","website_url":"/english/industry-en/2026/07/29/XJ6WMRBC35EYNBIIHYCN73BERQ/"},{"_id":"ZJNPPFBBQRFYPLIYQ7B6TDZX2A","canonical_url":"/english/kpop-culture-en/2026/07/27/ZJNPPFBBQRFYPLIYQ7B6TDZX2A/","description":{"basic":"[Sports Chosun Reporter Jeong Bit] Actor Joo Sang-wook boasted about his chemistry with the cast of \"Agent Kim Reactivated.\" Joo recently met with Sports Chosun at HB Entertainment's headquarters and said, \"So Ji-sub is the best action actor in South Korea. I felt comfortable during the action scenes,\" adding, \"I didn't realize Yoon Kyung-ho's vow of silence was because of me. Kyung-ho, I'm sorry.\" The SBS Friday-Saturday drama \"Agent Kim Reactivated,\" which concluded on July 25, depicted the story of Kim, a department head (So Ji-sub) who confronts his past to protect his daughter while living as an ordinary office worker. It garnered high interest for its fast-paced narrative, intense action, and the actors' solid performances."},"display_date":"2026-07-26T23:10:31Z","headlines":{"basic":"Joo Sang-wook Apologizes, Praises So Ji-sub's Action Skills","mobile":""},"last_updated_date":"2026-07-26T23:11:27.824Z","promo_items":{"basic":{"_id":"GUYTSZBVG42TCNJSHA4DGNZTGQ","additional_properties":{},"alt_text":"주상욱. 사진제공=HB엔터테인먼트","caption":"주상욱. 사진제공=HB엔터테인먼트","height":890,"resizedUrls":{"16x9_lg":"https://www.chosun.com/resizer/v2/GUYTSZBVG42TCNJSHA4DGNZTGQ.jpg?auth=190b9736aabdf9749c654d0d838ab63c054b2ef868bffcda42bde1e516aa6909&width=616&height=346&smart=true","16x9_md":"https://www.chosun.com/resizer/v2/GUYTSZBVG42TCNJSHA4DGNZTGQ.jpg?auth=190b9736aabdf9749c654d0d838ab63c054b2ef868bffcda42bde1e516aa6909&width=400&height=225&smart=true","16x9_sm":"https://www.chosun.com/resizer/v2/GUYTSZBVG42TCNJSHA4DGNZTGQ.jpg?auth=190b9736aabdf9749c654d0d838ab63c054b2ef868bffcda42bde1e516aa6909&width=184&height=104&smart=true","16x9_xxl":"https://www.chosun.com/resizer/v2/GUYTSZBVG42TCNJSHA4DGNZTGQ.jpg?auth=190b9736aabdf9749c654d0d838ab63c054b2ef868bffcda42bde1e516aa6909&width=700&height=393&smart=true","1x1_lg":"https://www.chosun.com/resizer/v2/GUYTSZBVG42TCNJSHA4DGNZTGQ.jpg?auth=190b9736aabdf9749c654d0d838ab63c054b2ef868bffcda42bde1e516aa6909&width=616&height=616&smart=true","1x1_md":"https://www.chosun.com/resizer/v2/GUYTSZBVG42TCNJSHA4DGNZTGQ.jpg?auth=190b9736aabdf9749c654d0d838ab63c054b2ef868bffcda42bde1e516aa6909&width=400&height=400&smart=true","1x1_sm":"https://www.chosun.com/resizer/v2/GUYTSZBVG42TCNJSHA4DGNZTGQ.jpg?auth=190b9736aabdf9749c654d0d838ab63c054b2ef868bffcda42bde1e516aa6909&width=184&height=184&smart=true","1x1_xxl":"https://www.chosun.com/resizer/v2/GUYTSZBVG42TCNJSHA4DGNZTGQ.jpg?auth=190b9736aabdf9749c654d0d838ab63c054b2ef868bffcda42bde1e516aa6909&width=700&height=700&smart=true"},"type":"image","url":"https://cloudfront-ap-northeast-1.images.arcpublishing.com/chosun/GUYTSZBVG42TCNJSHA4DGNZTGQ.jpg","width":700}},"taxonomy":{"primary_section":{"_id":"/english/kpop-culture-en","name":"Entertainment+"}},"type":"story","website_url":"/english/kpop-culture-en/2026/07/27/ZJNPPFBBQRFYPLIYQ7B6TDZX2A/"},{"_id":"C2SPOGOMIFDHZPRVRTOPQ2LWN4","canonical_url":"/english/kpop-culture-en/2026/07/27/C2SPOGOMIFDHZPRVRTOPQ2LWN4/","description":{"basic":"[Sports Chosun Reporter Jeong Bit] \"I thought, 'Why is the director acting like that?', but it seems his words were right.\" From a upright manager to a bold king, a warm husband and father—these are the characters that have defined actor Joo Sang-wook. This time, Joo has transformed into a ruthless villain who effortlessly erases lives. In the SBS Friday-Saturday drama '“Agent Kim Reactivated,” which concluded on July 25, Joo portrayed Joo Kang-chan, a construction company chairman with a background as a hired thug. A cold-blooded power figure who seizes what he desires through money and violence, and a twisted father figure who does not hesitate to kill for his daughter."},"display_date":"2026-07-26T23:13:46Z","headlines":{"basic":"Joo Sang-wook's Villain Role Marks Career Turning Point","mobile":""},"last_updated_date":"2026-07-26T23:14:45.531Z","promo_items":{"basic":{"_id":"GYYDIZRSG44TOOBXMI3GENJQMQ","additional_properties":{},"alt_text":"주상욱. 사진제공=HB엔터테인먼트","caption":"주상욱. 사진제공=HB엔터테인먼트","height":890,"resizedUrls":{"16x9_lg":"https://www.chosun.com/resizer/v2/GYYDIZRSG44TOOBXMI3GENJQMQ.jpg?auth=e980262684bc121b827dd293db3281ab188d76fd18bd6975ce6eb8e1168d6a1c&width=616&height=346&smart=true","16x9_md":"https://www.chosun.com/resizer/v2/GYYDIZRSG44TOOBXMI3GENJQMQ.jpg?auth=e980262684bc121b827dd293db3281ab188d76fd18bd6975ce6eb8e1168d6a1c&width=400&height=225&smart=true","16x9_sm":"https://www.chosun.com/resizer/v2/GYYDIZRSG44TOOBXMI3GENJQMQ.jpg?auth=e980262684bc121b827dd293db3281ab188d76fd18bd6975ce6eb8e1168d6a1c&width=184&height=104&smart=true","16x9_xxl":"https://www.chosun.com/resizer/v2/GYYDIZRSG44TOOBXMI3GENJQMQ.jpg?auth=e980262684bc121b827dd293db3281ab188d76fd18bd6975ce6eb8e1168d6a1c&width=700&height=393&smart=true","1x1_lg":"https://www.chosun.com/resizer/v2/GYYDIZRSG44TOOBXMI3GENJQMQ.jpg?auth=e980262684bc121b827dd293db3281ab188d76fd18bd6975ce6eb8e1168d6a1c&width=616&height=616&smart=true","1x1_md":"https://www.chosun.com/resizer/v2/GYYDIZRSG44TOOBXMI3GENJQMQ.jpg?auth=e980262684bc121b827dd293db3281ab188d76fd18bd6975ce6eb8e1168d6a1c&width=400&height=400&smart=true","1x1_sm":"https://www.chosun.com/resizer/v2/GYYDIZRSG44TOOBXMI3GENJQMQ.jpg?auth=e980262684bc121b827dd293db3281ab188d76fd18bd6975ce6eb8e1168d6a1c&width=184&height=184&smart=true","1x1_xxl":"https://www.chosun.com/resizer/v2/GYYDIZRSG44TOOBXMI3GENJQMQ.jpg?auth=e980262684bc121b827dd293db3281ab188d76fd18bd6975ce6eb8e1168d6a1c&width=700&height=700&smart=true"},"type":"image","url":"https://cloudfront-ap-northeast-1.images.arcpublishing.com/chosun/GYYDIZRSG44TOOBXMI3GENJQMQ.jpg","width":700}},"taxonomy":{"primary_section":{"_id":"/english/kpop-culture-en","name":"Entertainment+"}},"type":"story","website_url":"/english/kpop-culture-en/2026/07/27/C2SPOGOMIFDHZPRVRTOPQ2LWN4/"},{"_id":"NWCGBQSXCFBTTHHCR4LSFDRQII","canonical_url":"/english/kpop-culture-en/2026/07/27/NWCGBQSXCFBTTHHCR4LSFDRQII/","description":{"basic":"[OSEN=Kim Soo-hyung Reporter] Actor So Ji-sub’s recent act of gifting gold to co-stars and staff from his project has resurfaced past heartfelt gestures, including his sincere encouragement to the family of an ailing acquaintance. On July 26, various online communities and SNS platforms shared photos verifying the gifts So Ji-sub delivered to the cast and crew of the SBS weekend drama '“Agent Kim Reactivated.”’ The images showed gold pieces in custom cases, accompanied by handwritten thank-you notes. In his message, So Ji-sub wrote, “I felt immense emotion and happiness working on this project. I am deeply grateful to everyone who quietly illuminated '“Agent Kim Reactivated”’ from their respective roles,” expressing his appreciation for his colleagues. This is not the first time So Ji-sub has gifted gold. After completing filming for the Netflix series 'The Square' last year, he also gave one don of gold to actors, managers, and staff, sparking widespread attention. At the time, he explained, “Since taking on lead roles, I’ve always given gifts upon finishing a project. It’s a token of gratitude for safely completing filming. Without these people, I wouldn’t be here.” He added, “I used to give other gifts, but some thought they were sponsored. Gold can’t be sponsored, so I prepared it sincerely. These days are tough for everyone. If they ever face hardships, I hope they can sell it.” His warmth extended beyond film sets. In last year’s YouTube variety show 'Jjanhanhyeong,' So Ji-sub tearfully shared a message for the sister-in-law of a close friend battling illness. He said, “I heard my friend’s sister-in-law is very sick. I was asked to pass on encouragement, so I wanted to say this even through the screen. Sister-in-law, please stay strong,” choking up. Shin Dong-yup, a panelist, remarked, “So Ji-sub is truly remarkable. How many people would console a friend’s family on live TV? I heard the sister-in-law is a fan of 'Jjanhanhyeong.' If she watches, I hope she finds strength.” After '“Agent Kim Reactivated”’ concluded, So Ji-sub reiterated his gratitude. “This work was completed through everyone’s passion and effort,” he said. “I am sincerely thankful to all staff who endured the cold weather and to the actors who collaborated brilliantly. The unseen efforts of the staff made this project possible. Most of all, thank you to the viewers who stayed with us until the end.” While portraying the intense character in '“Agent Kim Reactivated,”’ So Ji-sub’s real-life consideration for colleagues and those around him has left another inspiring story. Fans praised him, writing, “A true Kim Chief in this era,” “His heart is more charming than his face,” and “No wonder he’s called ‘So Ji-sub, the cool one.’”"},"display_date":"2026-07-27T04:46:00Z","headlines":{"basic":"So Ji-sub Gifts Gold to Cast, Crew in Heartfelt Gesture","mobile":""},"last_updated_date":"2026-07-28T05:22:22.435Z","promo_items":{"basic":{"_id":"MM2DGYRUMQ3WEMDBHE3WEOJTHE","additional_properties":{},"alt_text":"","caption":"","height":744,"resizedUrls":{"16x9_lg":"https://www.chosun.com/resizer/v2/MM2DGYRUMQ3WEMDBHE3WEOJTHE.png?auth=62b8ba577a2a3afe6e507c917d6fc6babbb629c3d82be8b8680b501baa10c7bb&width=530&height=297&smart=true","16x9_md":"https://www.chosun.com/resizer/v2/MM2DGYRUMQ3WEMDBHE3WEOJTHE.png?auth=62b8ba577a2a3afe6e507c917d6fc6babbb629c3d82be8b8680b501baa10c7bb&width=400&height=225&smart=true","16x9_sm":"https://www.chosun.com/resizer/v2/MM2DGYRUMQ3WEMDBHE3WEOJTHE.png?auth=62b8ba577a2a3afe6e507c917d6fc6babbb629c3d82be8b8680b501baa10c7bb&width=184&height=104&smart=true","16x9_xxl":"https://www.chosun.com/resizer/v2/MM2DGYRUMQ3WEMDBHE3WEOJTHE.png?auth=62b8ba577a2a3afe6e507c917d6fc6babbb629c3d82be8b8680b501baa10c7bb&width=530&height=298&smart=true","1x1_lg":"https://www.chosun.com/re
