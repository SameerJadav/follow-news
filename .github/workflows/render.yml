name: render

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'render.py'
      - 'digest.py'
      # The hand-written frontend. Editing any of these should republish, since
      # the pipeline never rewrites them and a push alone would not otherwise
      # trigger a deploy.
      - 'docs/style.css'
      - 'docs/app.js'
      - 'docs/manifest.webmanifest'
      - 'docs/icon.svg'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      # No GEMINI_API_KEY here on purpose — render never needs the network
      # or an API key, only data/ on disk.
      - run: uv run digest.py render

      - name: Commit generated output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "render: re-render docs/"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.first.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - id: first
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - if: steps.first.outcome == 'failure'
        run: sleep 20

      - id: retry
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@v4
