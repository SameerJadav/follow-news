name: digest

on:
  schedule:
    # Three staggered fires targeting 02:00 / 04:00 / 06:00 IST, since
    # GitHub's free-tier cron can be delayed hours or dropped entirely.
    # digest.py --if-missing means whichever fires first does the work and
    # the rest no-op.
    - cron: '30 20 * * *'  # 02:00 IST
    - cron: '30 22 * * *'  # 04:00 IST
    - cron: '30 0 * * *'   # 06:00 IST
  workflow_dispatch:

# `issues: write` is here because Follow runs on THIS workflow's token, not
# follow.yml's: the daily sweep is where a stale follow's auto-close actually
# fires. With an explicit permissions block every unlisted scope is `none`, and
# on a public repo the anonymous-equivalent GET in fetch_issues() still works —
# so the sweep read its issues, wrote "closed" into followed/<n>/record.json,
# and 403'd on the POST and the PATCH. Follow #3 was closed on the site and open
# on the tracker for eleven days (ANALYSIS-2026-08-23.md §M1). Read-only would
# not be enough: closing the issue IS the kill switch this scope exists for.
permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# THE DEBUG SWITCH. "1" captures the full evidence of every run into
# debug/<date>/ (raw feeds, scraped pages, prompts, model responses, every
# rejection and why) and commits it, for the Phase 6 Part B calibration
# window. Set it to "0" to switch all of that off: no directory is created
# and no file is written, with no other change anywhere in the pipeline.
# debug/ is disposable -- it is never a source of truth, and deleting it
# only costs the record, never the digest.
env:
  DIGEST_DEBUG: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      - run: uv run digest.py --if-missing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # Additive and never on the digest's critical path: Follow runs after
      # the digest is written, and continue-on-error means a Follow failure
      # (a bad Gemini response, a GitHub API hiccup) can never fail this
      # workflow or block the digest from publishing.
      - name: Follow
        continue-on-error: true
        # Follow now researches rather than making one call, and it runs BEFORE
        # the commit and deploy steps below -- so an unbounded burst would delay
        # the digest's actual publish even though it cannot fail it. Whatever
        # research completes is checkpointed and resumes on the next run.
        timeout-minutes: 45
        run: uv run digest.py follow
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Capture is committed, derived and disposable, and unbounded it grew
      # 17 MB a day into 89% of the objects in a checkout all three daily crons
      # each pay for (report.RETAIN_DAYS carries the measurement). Pruning
      # before `git add` stages the deletions in the same commit as the day's
      # evidence. if: always() for the same reason the commit step below is: a
      # failed morning's evidence is what matters most. continue-on-error
      # because housekeeping must never be what takes a morning down.
      - name: Prune old debug captures
        if: always()
        continue-on-error: true
        run: uv run digest.py prune-debug

      # if: always() -- Phase 6: a quorum failure or an empty pass now makes
      # the digest step above exit 1 (deliberately, so the run shows red and
      # the owner gets GitHub's failure email). Before that step exited, it
      # already re-rendered docs/ with today's stale banner unhidden
      # (digest._render_stale), so this step's job is only to commit whatever
      # is on disk -- yesterday's honestly-labelled digest, not nothing.
      - name: Commit generated output
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # git tracks files, not directories, so data/ is absent from a fresh
          # checkout until the first digest is written -- and a run that fails
          # before write_digest never creates it. `git add` on a missing
          # pathspec is a fatal error, which would kill this step and take the
          # honest stale page down with it. mkdir first so the fallback always
          # gets committed, which is the whole point of `if: always()` here.
          # debug/ joins them for the same reason: it is absent when
          # DIGEST_DEBUG is "0", and a failed morning's evidence is exactly
          # what must survive, so it is committed under if: always() too.
          mkdir -p data docs followed debug cache
          git add data docs followed debug cache
          git diff --cached --quiet || git commit -m "digest: $(date -u +%F)"
          # The issue-triggered follow workflow can commit between this job's
          # checkout and this push; retry with a rebase rather than racing it.
          for i in 1 2 3; do
            git push && break
            git pull --rebase origin main || true
            sleep 5
          done

      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: docs

  deploy:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.first.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      # Pages deploys fail transiently; retry once after a short sleep
      # rather than failing the whole morning over it.
      - id: first
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - if: steps.first.outcome == 'failure'
        run: sleep 20

      - id: retry
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@v4

  # Never gates the digest or its deploy -- needs: build so it reads the
  # commit build just pushed, but if: always() means a red build (a quorum
  # failure, say) doesn't skip this too. A dying feed turns THIS job red and
  # the owner gets GitHub's failure email; the digest itself is unaffected.
  health:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      # No GEMINI_API_KEY -- this reads committed data/ only.
      - run: uv run digest.py health
